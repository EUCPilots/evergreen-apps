name: Update Microsoft Static Apps

on:
  schedule:
    # Run at 9:00 AM UTC on weekdays (Monday-Friday)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_NAME: microsoft-static-apps

jobs:
  update-ssms-versions:
    runs-on: ubuntu-latest
    name: 'Update SSMS'
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.changes_detected }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Parse SSMS version pages and update JSON
        id: update-versions
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import re
          import sys
          import os
          
          # Define URLs and corresponding manifest files
          versions = {
              "22": {
                  "url": "https://learn.microsoft.com/en-us/ssms/release-notes-22",
                  "manifest": "Manifests/MicrosoftSsms.json"
              },
              "21": {
                  "url": "https://learn.microsoft.com/en-us/ssms/release-notes-21",
                  "manifest": "Manifests/MicrosoftSsms21.json"
              },
              "20": {
                  "url": "https://learn.microsoft.com/en-us/ssms/release-notes-20",
                  "manifest": "Manifests/MicrosoftSsms20.json"
              }
          }
          
          # Version regex pattern (e.g., 22.2.1, 21.0.0, 20.1.2)
          version_pattern = re.compile(r'^\d+\.\d+\.\d+$')
          
          changes_made = False
          
          for version_key, config in versions.items():
              url = config["url"]
              manifest_path = config["manifest"]
              
              print(f"\nProcessing SSMS {version_key}")
              print(f"URL: {url}")
              
              try:
                  response = requests.get(url, timeout=30)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.content, 'html.parser')
                  
                  # Find the first h3 element
                  h3_element = soup.find('h3')
                  
                  if not h3_element:
                      print(f"Warning: No h3 element found for SSMS {version_key}")
                      continue
                  
                  version_string = h3_element.get_text(strip=True)
                  print(f"Found version string: {version_string}")
                  
                  # Validate version format
                  if not version_pattern.match(version_string):
                      print(f"Error: Version '{version_string}' does not match expected pattern (X.Y.Z)")
                      sys.exit(1)
                  
                  # Read the manifest file
                  with open(manifest_path, 'r') as f:
                      data = json.load(f)
                  
                  # Get old version for comparison
                  old_version = data['Get']['Download']['Version']
                  print(f"Old version: {old_version}")
                  
                  # Update the version
                  data['Get']['Download']['Version'] = version_string
                  
                  # Write updated JSON back to file
                  with open(manifest_path, 'w') as f:
                      json.dump(data, f, indent=4)
                  
                  # Check if version actually changed
                  if old_version != version_string:
                      print(f"Version updated from {old_version} to {version_string}")
                      changes_made = True
                  else:
                      print(f"Version unchanged ({version_string})")
                      
              except Exception as e:
                  print(f"Error processing SSMS {version_key}: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)
          
          # Output whether changes were made
          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output and changes_made:
              with open(github_output, 'a') as f:
                  f.write("changes_made=true\n")
          elif github_output:
              with open(github_output, 'a') as f:
                  f.write("changes_made=false\n")
          
          EOF
      
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet -- Manifests/MicrosoftSsms.json Manifests/MicrosoftSsms21.json Manifests/MicrosoftSsms20.json; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git diff -- Manifests/MicrosoftSsms.json Manifests/MicrosoftSsms21.json Manifests/MicrosoftSsms20.json
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH_NAME"
          git add Manifests/MicrosoftSsms.json Manifests/MicrosoftSsms21.json Manifests/MicrosoftSsms20.json
          git commit -m 'Update Microsoft SQL Server Management Studio versions'
          git push -f --set-upstream origin "$BRANCH_NAME"

  update-fslogix-versions:
    runs-on: ubuntu-latest
    name: 'Update FSLogix'
    needs: update-ssms-versions
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.changes_detected }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Parse FSLogix version page and update JSON
        id: update-versions
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import re
          import sys
          import os
          
          # Define URLs and corresponding manifest files
          versions = {
              "latest": {
                  "url": "https://learn.microsoft.com/en-us/fslogix/overview-release-notes",
                  "manifest": "Manifests/MicrosoftFSLogixApps.json"
              }
          }
          
          # Match the first FSLogix build version in page order (e.g., 3.26.126.19110)
          version_pattern = re.compile(r'\b\d+\.\d+\.\d+\.\d+\b')
          
          changes_made = False
          
          for version_key, config in versions.items():
              url = config["url"]
              manifest_path = config["manifest"]
              
              print(f"\nProcessing FSLogix {version_key}")
              print(f"URL: {url}")
              
              try:
                  response = requests.get(url, timeout=30)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.content, 'html.parser')

                  main_content = soup.find('main') or soup
                  version_match = version_pattern.search(main_content.get_text("\n", strip=True))

                  if not version_match:
                      print(f"Warning: No FSLogix build version found for {version_key}")
                      continue

                  version_string = version_match.group(0)
                  print(f"Found version string: {version_string}")
                  
                  # Validate version format
                  if not version_pattern.fullmatch(version_string):
                      print(f"Error: Version '{version_string}' does not match expected pattern (X.Y.Z.W)")
                      sys.exit(1)
                  
                  # Read the manifest file
                  with open(manifest_path, 'r') as f:
                      data = json.load(f)
                  
                  # Get old version for comparison
                  old_version = data['Get']['Download']['Version']
                  print(f"Old version: {old_version}")
                  
                  # Update the version
                  data['Get']['Download']['Version'] = version_string
                  
                  # Write updated JSON back to file
                  with open(manifest_path, 'w') as f:
                      json.dump(data, f, indent=4)
                  
                  # Check if version actually changed
                  if old_version != version_string:
                      print(f"Version updated from {old_version} to {version_string}")
                      changes_made = True
                  else:
                      print(f"Version unchanged ({version_string})")
                      
              except Exception as e:
                  print(f"Error processing FSLogix {version_key}: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)
          
          # Output whether changes were made
          github_output = os.environ.get('GITHUB_OUTPUT')
          if github_output and changes_made:
              with open(github_output, 'a') as f:
                  f.write("changes_made=true\n")
          elif github_output:
              with open(github_output, 'a') as f:
                  f.write("changes_made=false\n")
          
          EOF
      
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet -- Manifests/MicrosoftFSLogixApps.json; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git diff -- Manifests/MicrosoftFSLogixApps.json
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi
          git add Manifests/MicrosoftFSLogixApps.json
          git commit -m 'Update Microsoft FSLogix versions'
          git push -f origin "$BRANCH_NAME"

  create-microsoft-static-pr:
    runs-on: ubuntu-latest
    name: 'Create Microsoft Static PR'
    needs:
      - update-ssms-versions
      - update-fslogix-versions
    if: needs.update-ssms-versions.outputs.changes_detected == 'true' || needs.update-fslogix-versions.outputs.changes_detected == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pr_url=$(gh pr create \
            --title "Update Microsoft Static App Versions" \
            --body "## Automated Update: Microsoft Static Apps

          This PR updates version numbers for Microsoft static apps tracked by this workflow.

          **Possible changes:**
          - Updated Microsoft SQL Server Management Studio versions in Manifests/MicrosoftSsms.json
          - Updated Microsoft SQL Server Management Studio versions in Manifests/MicrosoftSsms21.json
          - Updated Microsoft SQL Server Management Studio versions in Manifests/MicrosoftSsms20.json
          - Updated Microsoft FSLogix version in Manifests/MicrosoftFSLogixApps.json

          **Sources:**
          - https://learn.microsoft.com/en-us/ssms/release-notes-22
          - https://learn.microsoft.com/en-us/ssms/release-notes-21
          - https://learn.microsoft.com/en-us/ssms/release-notes-20
          - https://learn.microsoft.com/en-us/fslogix/overview-release-notes

          **Auto-generated by:** GitHub Actions workflow" \
            --base main \
            --head "$BRANCH_NAME" \
            --label automated 2>/dev/null || gh pr view "$BRANCH_NAME" --json url --jq '.url')
          if [ -z "${pr_url}" ]; then
            echo "Error: failed to create or retrieve PR URL"
            exit 1
          fi
          pr_number=$(echo "${pr_url}" | grep -oE '[0-9]+$')
          if [ -z "${pr_number}" ]; then
            echo "Error: could not extract PR number from URL: ${pr_url}"
            exit 1
          fi
          echo "pr_number=${pr_number}" >> $GITHUB_OUTPUT
          echo "PR number: ${pr_number}"

      - name: Validate PR changes
        id: validate-pr
        run: |
          set -e

          git fetch origin main

          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "${changed_files}"

          unexpected=$(echo "${changed_files}" | grep -vx 'Manifests/MicrosoftSsms\.json\|Manifests/MicrosoftSsms21\.json\|Manifests/MicrosoftSsms20\.json\|Manifests/MicrosoftFSLogix\.json' || true)
          if [ -n "${unexpected}" ]; then
            echo "Validation failed: unexpected files changed:"
            echo "${unexpected}"
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          for manifest in Manifests/MicrosoftSsms.json Manifests/MicrosoftSsms21.json Manifests/MicrosoftSsms20.json Manifests/MicrosoftFSLogixApps.json; do
            if ! echo "${changed_files}" | grep -qx "${manifest}"; then
              continue
            fi
            old_json=$(git show origin/main:"${manifest}")
            new_json=$(cat "${manifest}")
            if ! diff \
              <(printf '%s' "${old_json}" | jq -S 'del(.Get.Download.Version)') \
              <(printf '%s' "${new_json}" | jq -S 'del(.Get.Download.Version)') > /dev/null 2>&1; then
              echo "Validation failed: changes beyond Get.Download.Version detected in ${manifest}"
              echo "validation_passed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            new_version=$(printf '%s' "${new_json}" | jq -r '.Get.Download.Version // empty')
            case "${manifest}" in
              Manifests/MicrosoftFSLogixApps.json)
                version_regex='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
                ;;
              *)
                version_regex='^[0-9]+\.[0-9]+\.[0-9]+$'
                ;;
            esac
            if [ -z "${new_version}" ] || ! [[ "${new_version}" =~ ${version_regex} ]]; then
              echo "Validation failed: invalid Get.Download.Version in ${manifest}: ${new_version}"
              echo "validation_passed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${manifest}: Get.Download.Version updated to ${new_version}"
          done

          echo "Validation passed"
          echo "validation_passed=true" >> $GITHUB_OUTPUT

      - name: Auto-merge Pull Request
        if: steps.validate-pr.outputs.validation_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.create-pr.outputs.pr_number }}"
          echo "Auto-merging PR #${pr_number}"
          gh pr merge "${pr_number}" --squash --auto --delete-branch || echo "Auto-merge could not be enabled; leaving PR open for manual review."
